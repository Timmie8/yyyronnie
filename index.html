<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YRobot Live Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        #tradingview_chart { height: 550px; width: 100%; }
        .loading-spinner {
            border: 3px solid rgba(255,255,255,0.1);
            border-left-color: #3b82f6;
            border-radius: 50%;
            width: 20px; height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block; vertical-align: middle; margin-right: 8px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 font-sans p-4 md:p-8">
    <div class="max-w-6xl mx-auto">
        <h1 class="text-3xl font-bold mb-2 text-blue-400">📈 YRobot Live Dashboard</h1>
        <p class="text-gray-400 mb-6 text-sm">Data automatisch bijgewerkt via GitHub Actions. <span id="lastUpdate" class="text-green-400"></span></p>

        <!-- INVOER SECTIE -->
        <div class="bg-gray-800 p-5 rounded-xl shadow-lg mb-6 border border-gray-700">
            <label class="block text-sm font-medium mb-2 text-gray-300">Voeg nieuwe tickers toe aan de monitor:</label>
            <div class="flex flex-col sm:flex-row gap-3">
                <input type="text" id="tickerInput" placeholder="Bijv. AMD, META, PLTR" 
                       class="flex-1 bg-gray-900 border border-gray-600 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-blue-500 transition font-mono uppercase">
                <button onclick="addTickers()" id="addBtn"
                        class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-lg transition flex items-center justify-center gap-2">
                    <span>➕ Toevoegen & Grafiek Laden</span>
                </button>
            </div>
        </div>

        <!-- SCORES TABEL -->
        <div class="bg-gray-800 rounded-xl shadow-lg mb-6 overflow-hidden border border-gray-700">
            <div class="p-4 border-b border-gray-700 flex justify-between items-center">
                <h2 class="text-lg font-semibold">Live Scores Overzicht</h2>
                <button onclick="loadData()" class="text-xs bg-gray-700 hover:bg-gray-600 px-3 py-1 rounded transition">🔄 Ververs Tabel</button>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead class="bg-gray-700/50 text-gray-300 text-sm uppercase">
                        <tr>
                            <th class="p-4">Ticker</th>
                            <th class="p-4">Analysis Score</th>
                            <th class="p-4">AI Score</th>
                            <th class="p-4">Technical Score</th> <!-- NIEUWE KOLOM -->
                            <th class="p-4 text-center">Actie</th>
                        </tr>
                    </thead>
                    <tbody id="scoresTableBody">
                        <tr><td colspan="5" class="p-8 text-center text-gray-500">Laden...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- GRAFIEK SECTIE -->
        <div class="bg-gray-800 p-1 rounded-xl shadow-lg border border-gray-700">
            <h2 class="text-xl font-bold text-blue-400 p-4" id="chartTitle">Grafiek: SMG</h2>
            <div id="tradingview_chart"></div>
        </div>
    </div>

    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script>
        let currentWidget = null;
        let knownData = {}; 

        function loadChart(ticker) {
            document.getElementById('chartTitle').innerText = `Grafiek: ${ticker.toUpperCase()}`;
            if (currentWidget) document.getElementById('tradingview_chart').innerHTML = '';
            currentWidget = new TradingView.widget({
                "autosize": true, "symbol": ticker, "interval": "D",
                "timezone": "Europe/Amsterdam", "theme": "dark", "style": "1",
                "locale": "nl", "container_id": "tradingview_chart"
            });
        }

        // Slimme kleurfunctie voor alle balken
        function getBarColor(score) {
            if (score >= 70) {
                const lightness = 70 - ((score - 70) / 30) * 40; // 70% (licht) naar 30% (donker)
                return `hsl(142, 76%, ${lightness}%)`;
            } else if (score >= 40) {
                return 'hsl(45, 93%, 47%)'; // Geel
            } else {
                return 'hsl(0, 84%, 60%)'; // Rood
            }
        }

        function createBarHTML(score) {
            let scoreVal = 0;
            let barStyle = 'background-color: #4b5563;';
            if (score && !isNaN(score)) {
                scoreVal = parseInt(score);
                barStyle = `background-color: ${getBarColor(scoreVal)};`;
            }
            return `
                <div class="flex items-center gap-3">
                    <div class="w-24 bg-gray-700 rounded-full h-2.5">
                        <div class="h-2.5 rounded-full transition-all duration-700" style="${barStyle} width: ${scoreVal}%"></div>
                    </div>
                    <span class="font-mono font-bold text-sm">${score || 'N/A'}</span>
                </div>
            `;
        }

        async function loadData() {
            try {
                const response = await fetch('./data/data.json?t=' + Date.now());
                const data = await response.json();
                knownData = {};
                data.forEach(item => { if (!item.error) knownData[item.ticker.toUpperCase()] = item; });
                renderTable(Object.values(knownData));
                document.getElementById('lastUpdate').innerText = `Laatste update: ${new Date().toLocaleString('nl-NL')}`;
            } catch (e) {
                document.getElementById('scoresTableBody').innerHTML = `<tr><td colspan="5" class="p-8 text-center text-red-400">Fout bij laden data.</td></tr>`;
            }
        }

        function renderTable(dataArray) {
            const tbody = document.getElementById('scoresTableBody');
            tbody.innerHTML = '';
            if (dataArray.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="p-8 text-center text-gray-500">Geen data.</td></tr>`;
                return;
            }
            dataArray.sort((a, b) => a.ticker.localeCompare(b.ticker));

            dataArray.forEach(item => {
                let sentimentColor = 'bg-gray-700 text-gray-300 border-gray-600';
                if (item.sentiment === 'Bullish') sentimentColor = 'bg-green-900/50 text-green-400 border-green-700';
                else if (item.sentiment === 'Bearish') sentimentColor = 'bg-red-900/50 text-red-400 border-red-700';

                tbody.innerHTML += `
                    <tr class="border-b border-gray-700/50 hover:bg-gray-700/30 transition">
                        <td class="p-4 font-bold text-blue-400 text-lg font-mono">${item.ticker}</td>
                        
                        <!-- Analysis Score -->
                        <td class="p-4">
                            <div class="flex flex-col gap-2">
                                ${createBarHTML(item.analysisScore)}
                                <span class="px-2 py-0.5 rounded text-xs font-bold border ${sentimentColor} w-fit">
                                    ${item.sentiment || 'N/A'}
                                </span>
                            </div>
                        </td>
                        
                        <!-- AI Score -->
                        <td class="p-4">${createBarHTML(item.aiScore)}</td>
                        
                        <!-- Technical Score (Voorheen Status) -->
                        <td class="p-4">${createBarHTML(item.technicalScore)}</td>
                        
                        <!-- Actie -->
                        <td class="p-4 text-center">
                            <button onclick="loadChart('${item.ticker}')" class="bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold py-2 px-4 rounded-lg transition">
                                Grafiek
                            </button>
                        </td>
                    </tr>
                `;
            });
        }

        async function addTickers() {
            const input = document.getElementById('tickerInput').value;
            const newTickers = input.split(',').map(t => t.trim().toUpperCase()).filter(t => t.length > 0);
            if (newTickers.length === 0) return;
            for (const ticker of newTickers) {
                knownData[ticker] = { ticker, aiScore: null, technicalScore: null, analysisScore: null, sentiment: 'Wachten' };
                loadChart(ticker);
            }
            renderTable(Object.values(knownData));
            document.getElementById('tickerInput').value = '';
            alert(`Grafiek geladen! Voeg de tickers toe aan .github/workflows/scrape.yml en draai de Action voor de scores.`);
        }

        window.onload = () => { loadChart('SMG'); loadData(); setInterval(loadData, 300000); };
    </script>
</body>
</html>
