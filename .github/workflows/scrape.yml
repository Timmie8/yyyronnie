name: Scrape YRobot Data

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install chromium
          playwright install-deps

      - name: Create scraper script
        run: |
          mkdir -p scripts
          cat > scripts/scraper.py << 'PYEOF'
          import json
          import re
          import asyncio
          from playwright.async_api import async_playwright

          TICKERS = ["PMI","ZETA","IRD","CPRI","LADR","MBLY","FOX","SMTC","PRAX","EIKN","AA","ELAN","SPGI","PLD","CON","NOW","TWLO","HNGE"]

          async def scrape_ticker(ticker):
              async with async_playwright() as p:
                  browser = await p.chromium.launch(headless=True)
                  page = await browser.new_page()
                  try:
                      await page.goto(f"https://yrobot.us/chart/{ticker}", timeout=30000)
                      await page.wait_for_timeout(5000)
                      content = await page.inner_text("body")
                      
                      # AI Score
                      ai_match = re.search(r'AI\s*Score\s*[:\-]?\s*([\d\.]+)', content, re.IGNORECASE)
                      
                      # Technical Score - MEERDERE PATRONEN OM ZEKER TE ZIJN
                      tech_match = (
                          re.search(r'Technical\s*Score\s*[:\-]?\s*([\d\.]+)', content, re.IGNORECASE) or
                          re.search(r'Technical\s*Score([\d\.]+)', content, re.IGNORECASE) or
                          re.search(r'Technical.*?(\d{2,3}(?:\.\d+)?)', content, re.IGNORECASE | re.DOTALL)
                      )
                      
                      # Analysis Score (het getal vóór Bullish/Bearish)
                      sentiment_match = re.search(r'(\d{2,3})\s+(Bullish|Bearish|Neutral)', content, re.IGNORECASE)
                      
                      # Datum
                      date_match = re.search(r'Analysis\s+([\d\/\s:]+)', content, re.IGNORECASE)
                      
                      return {
                          "ticker": ticker,
                          "aiScore": float(ai_match.group(1)) if ai_match else None,
                          "technicalScore": float(tech_match.group(1)) if tech_match else None,
                          "analysisScore": int(sentiment_match.group(1)) if sentiment_match else None,
                          "sentiment": sentiment_match.group(2) if sentiment_match else "Onbekend",
                          "date": date_match.group(1).strip() if date_match else "N/A"
                      }
                  except Exception as e:
                      print(f"Fout bij {ticker}: {e}")
                      return {"ticker": ticker, "error": str(e)}
                  finally:
                      await browser.close()

          async def main():
              results = []
              for ticker in TICKERS:
                  print(f"Scrappen: {ticker}")
                  data = await scrape_ticker(ticker)
                  results.append(data)
                  await asyncio.sleep(2)
              with open("data/data.json", "w") as f:
                  json.dump(results, f, indent=2)
              print("✅ Data opgeslagen in data/data.json")

          if __name__ == "__main__":
              asyncio.run(main())
          PYEOF

      - name: Ensure data directory exists
        run: mkdir -p data

      - name: Run scraper
        run: python scripts/scraper.py

      - name: Commit and push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/data.json
          git diff --staged --quiet || git commit -m "Update yrobot data $(date)"
          git push
